id: NESSUS-IMPORT-001
name: Nessus Essentials Import
category: Vulnerability
description: Import Nessus Essentials .nessus scan result
type: command

inputs:
  - name: NESSUS_FILE
    description: Nessus .nessus file
    required: true

command:
  exec: python3
  args:
    - scripts/parse_nessus.py
    - "{{NESSUS_FILE}}"

parser:
  type: json
  findings:
    - id: plugin_id
      title: plugin_name
      severity: severity
      description: description
      cvss: cvss_base_score

risk:
  scoring:
    source: cvss
    scale: 10
